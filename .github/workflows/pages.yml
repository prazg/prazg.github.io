name: Verify & Deploy Central Observatory to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  verify:
    name: Run Portal Verification Gate (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ensure .nojekyll exists
        run: touch .nojekyll

      - name: Run static syntax, URL, DOM, ES module & WCAG verification gate
        run: python tests/verify_portal.py

  deploy:
    name: Deploy to GitHub Pages
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure .nojekyll exists at root
        run: touch .nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload root static artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
